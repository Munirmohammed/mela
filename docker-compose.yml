services:
  postgres:
    image: postgres:15-alpine
    container_name: mela-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meladb
      POSTGRES_USER: mela
      POSTGRES_PASSWORD: secret
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mela -d meladb']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mela-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mela-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      # The dedicated worker owns queue consumption + scheduling.
      RUN_WORKERS_IN_API: 'false'
      DATABASE_URL: postgresql://mela:secret@postgres:5432/meladb
      REDIS_URL: redis://redis:6379

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mela-worker
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mela:secret@postgres:5432/meladb
      REDIS_URL: redis://redis:6379

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: mela-admin-web
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
